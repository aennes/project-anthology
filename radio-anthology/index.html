<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#ff1801" />
    <meta
      name="description"
      content="Project Anthology — iconic Formula 1 team radio moments: context, significance, and links back to the archive."
    />
    <title>Radio Anthology • Project Anthology</title>
    <!--
      Routing: single index.html + location.hash (e.g. #multi-21-malaysia-2013).
      Cards link to #id; hashchange swaps index grid vs editorial detail — no modal.
    -->
    <link rel="preload" href="/fonts/st/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/st/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/data/radio-images.json" as="fetch" crossorigin />
    <link rel="stylesheet" href="/nav-shell.css" />
    <link rel="stylesheet" href="/cinematic.css" />
    <link rel="stylesheet" href="/radio-anthology/styles.css" />
  </head>
  <body class="has-anthology-nav is-index">
    <a class="skip" href="#main">Skip to content</a>

    <div id="anthology-nav-root"></div>

    <header class="page-subbar" role="banner">
      <div class="page-subbar__inner">
        <div class="brand">
          <p class="brand__index font-mono">Formula 1 · Radio Anthology</p>
          <div class="brand__stack">
            <div class="brand__kicker">Formula 1</div>
            <div class="brand__title">Radio Anthology</div>
          </div>
        </div>
        <a class="topbar__moments" id="topbarMoments" href="#" hidden aria-label="Back to all moments">← All moments</a>
      </div>
    </header>

    <main id="main" class="page" role="main" tabindex="-1">
      <div id="viewIndex" class="raIndex">
        <section class="raHero" aria-labelledby="heroTitle">
          <div class="raHero__bg" aria-hidden="true">
            <div class="raHero__ambient"></div>
            <div class="raHero__streak"></div>
            <div class="raHero__shade raHero__shade--top"></div>
            <div class="raHero__shade raHero__shade--bottom"></div>
          </div>
          <div class="raHero__vignette" aria-hidden="true"></div>
          <div class="raHero__inner">
            <div class="raHero__pretitle">
              <span class="raHero__rule" aria-hidden="true"></span>
              <p class="raHero__eyebrow font-mono">Team radio &amp; pit wall</p>
              <span class="raHero__rule" aria-hidden="true"></span>
            </div>
            <h1 id="heroTitle" class="raHero__title">
              <span class="raHero__titleWord raHero__titleWord--radio">Radio</span>
              <span class="raHero__titleWord raHero__titleWord--main">Anthology</span>
            </h1>
            <p class="raHero__deck font-mono">Iconic team radio from the pit wall and the helmet.</p>
          </div>
          <div class="raHero__scroll" aria-hidden="true">
            <span class="raHero__scrollLine"></span>
            <span class="raHero__scrollLab">Scroll</span>
          </div>
        </section>

        <section class="gridSection" aria-label="Radio moments">
          <p class="gridSection__meta font-mono" id="archiveCount" role="status">—</p>
          <div id="cardGrid" class="raGrid" aria-live="polite"></div>
        </section>
      </div>

      <div id="viewDetail" class="raDetail" hidden>
        <article id="detailArticle" class="detailArticle"></article>
      </div>

    </main>

    <footer class="ra-footer" role="contentinfo">
      <div class="ra-footer__inner">
        <span class="ra-footer__mono font-mono">Project Anthology</span>
        <span class="ra-footer__rule" aria-hidden="true"></span>
        <span class="ra-footer__muted">Radio moments are editorially framed; audio URLs may follow in a later pass.</span>
      </div>
    </footer>

    <script src="/nav-shell.js" defer></script>
    <script src="/cinematic.js" defer></script>
    <script src="/radio-anthology/app.js" defer></script>
  </body>
</html>
